# =====================================================================
# ProyectoHV — Configuración de SonarQube Local y SonarCloud
# =====================================================================
# Para análisis local (Docker / Jenkins):
#   - Se utiliza sonar.projectKey=proyectohv (Community Edition, sin organización)
# Para análisis Cloud (GitHub Actions -> SonarCloud):
#   - El workflow inyecta vía CLI args:
#       -Dsonar.organization=hamartinez9408
#       -Dsonar.projectKey=hamartinez9408_ProyectoHV
# =====================================================================

sonar.projectKey=proyectohv
sonar.projectName=ProyectoHV
sonar.projectVersion=0.1.0

# Fuentes de código a analizar
sonar.sources=web/src,pipelines,tools

# Exclusiones de análisis estático y dependencias
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.scannerwork/**,\
  **/.agents/**,\
  **/.zcode/**,\
  **/docs/**,\
  **/scratch/**,\
  **/out/**,\
  **/*.d.ts

# Codificación
sonar.sourceEncoding=UTF-8

# TypeScript configuración
sonar.typescript.tsconfigPaths=web/tsconfig.sonar.json

# Reportes de Cobertura de Código (Frontend LCOV y Backend JaCoCo)
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=services/*/target/site/jacoco/jacoco.xml
